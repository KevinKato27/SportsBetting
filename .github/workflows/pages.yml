name: Deploy OVERLAY to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 7,11,16,23 * * *'
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Refresh source-audited daily data
        if: github.event_name != 'push'
        run: pnpm refresh:data
      - name: Validate daily data
        run: pnpm validate:data
      - name: Validate prompt and audit policy
        run: pnpm validate:config
      - name: Validate public-safe chat intake
        run: pnpm validate:intake
      - name: Validate morning slate scan
        run: pnpm validate:morning
      - name: Validate today's research board
        run: pnpm validate:board
      - name: Sync tracker workbook
        if: github.event_name != 'push'
        run: pnpm sync:workbook
      - name: Save refreshed snapshot
        if: github.event_name != 'push'
        run: |
          git config user.name "OVERLAY Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/slates data/chat-intake data/morning-scan data/research-board data/imports/sports_betting_backtest_tracker_v0_45.xlsx
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh daily slate"
            git push
          fi
      - name: Build GitHub Pages site
        run: pnpm build:pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
