<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>OVERLAY — bet research desk</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{
  --bg:#0d1017; --panel:#141922; --panel-2:#1b212c; --line:#242c39; --line-2:#2f3a4a;
  --ink:#e8ecf3; --ink-2:#aeb8c7; --muted:#6b7688;
  --accent:#4c8dff; --accent-2:#2f6fe0; --paper:#c07bff; --paper-2:#9b5be0;
  --pos:#3fd08b; --neg:#f0655f; --warn:#efb552;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
.mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
#root{min-height:100vh}
.boot{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;padding:11px 20px;background:rgba(13,16,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;margin-right:6px}
.brand-mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#7db0ff);box-shadow:0 0 0 1px rgba(255,255,255,.06) inset,0 4px 14px rgba(76,141,255,.35)}
.brand-name{font-family:'Space Grotesk';font-weight:700;letter-spacing:.16em;font-size:15px}
.brand-sub{font-size:10px;color:var(--muted);letter-spacing:.04em}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{background:none;border:none;color:var(--ink-2);padding:8px 13px;border-radius:8px;cursor:pointer;font-size:13.5px;font-family:inherit}
.tab:hover{color:var(--ink);background:var(--panel)}
.tab.on{color:#fff;background:var(--panel-2);box-shadow:inset 0 -2px 0 var(--accent)}
.keydot{width:8px;height:8px;border-radius:50%;margin-left:auto}
.main{max-width:1180px;margin:0 auto;padding:20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line);gap:10px}
.panel-head h3{margin:0;font-size:13px;font-weight:600}
.panel-body{padding:16px}
.hint{font-size:11.5px;color:var(--muted)}
.grow{flex:1}
.row-flex{display:flex;align-items:center;gap:10px}
.badge{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.03em;padding:2px 7px;border:1px solid var(--line-2);border-radius:6px;line-height:1.5;white-space:nowrap}
.tag-real{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.tag-paper{color:var(--paper);border-color:color-mix(in srgb,var(--paper) 45%,transparent)}
.btn{font-family:inherit;font-size:13px;font-weight:500;border-radius:9px;padding:8px 15px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);cursor:pointer}
.btn:hover{background:#232b38}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.paper{background:var(--paper-2);border-color:var(--paper-2);color:#fff}
.btn.paper:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;border-color:color-mix(in srgb,var(--neg) 45%,transparent);color:var(--neg)}
.btn.small{padding:5px 11px;font-size:12px}
.btn:disabled{opacity:.55;cursor:default}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.stat-label{font-size:11px;color:var(--muted)}
.stat-value{font-family:'Space Grotesk';font-weight:600;font-size:23px;margin-top:5px}
.stat-sub{font-size:11px;color:var(--ink-2);margin-top:3px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hero{display:grid;grid-template-columns:minmax(190px,280px) 1fr;gap:20px;align-items:center;background:linear-gradient(180deg,var(--panel),#11151d);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px}
.hero-label{font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.hero-bank{font-family:'Space Grotesk';font-weight:700;font-size:46px;line-height:1;margin-top:6px}
.hero-meta{display:flex;gap:10px;align-items:center;margin-top:9px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.lead{display:flex;flex-direction:column;gap:8px}
.lead-row{display:grid;grid-template-columns:120px 1fr 42px 30px;gap:10px;align-items:center;font-size:12.5px}
.lead-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.lead-bar{height:7px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.lead-fill{height:100%;border-radius:4px}
.lead-val{text-align:right}.lead-obs{text-align:right;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field>span{font-size:11px;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 11px;font-family:inherit;font-size:13px;width:100%}
.field textarea{resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.form-grid.two{grid-template-columns:1fr 1fr}
.form-actions{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.subtabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.subtab{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);color:var(--ink-2);padding:7px 13px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px}
.subtab.on{color:#fff;border-color:var(--accent-2);background:var(--panel-2)}
.subtab.on.paper{border-color:var(--paper-2)}
.subtab .count{font-size:10.5px;color:var(--muted);background:var(--bg);padding:1px 6px;border-radius:20px}
.toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.search,.toolbar select{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 11px;font-family:inherit;font-size:13px}
.search{min-width:150px;flex:1}
.tablewrap{border:1px solid var(--line);border-radius:12px;overflow:auto;background:var(--panel);-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl thead th{position:sticky;top:0;background:var(--panel-2);color:var(--muted);font-weight:500;text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11px}
.tbl th.r,.tbl td.r{text-align:right}
.tbl td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
.row{cursor:pointer}.row:hover{background:var(--panel-2)}
.strong{font-weight:600;color:#fff}.dim{color:var(--muted)}.nowrap{white-space:nowrap}
.chev{color:var(--muted);text-align:right;font-size:16px}
.dec{font-size:11px;font-weight:600}
.dec[data-d="BET"]{color:var(--pos)}.dec[data-d="QUALIFIED_NOT_BET"]{color:var(--warn)}.dec[data-d="REJECTED"]{color:var(--neg)}
.empty{padding:26px 20px;text-align:center;color:var(--muted);font-size:12.5px;max-width:560px;margin:0 auto}
.modal-scrim{position:fixed;inset:0;background:rgba(6,9,14,.62);z-index:50;display:grid;place-items:start center;padding:30px 14px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line-2);border-radius:16px;width:100%;max-width:600px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.modal.wide{max-width:780px}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:15px}
.modal-head .x{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer}
.modal-body{padding:18px}
.err{margin-top:10px;font-size:12px;color:var(--neg);background:color-mix(in srgb,var(--neg) 10%,transparent);border:1px solid color-mix(in srgb,var(--neg) 30%,transparent);border-radius:9px;padding:9px 11px;white-space:pre-wrap}
.ok{margin-top:10px;font-size:12px;color:var(--pos);background:color-mix(in srgb,var(--pos) 10%,transparent);border:1px solid color-mix(in srgb,var(--pos) 30%,transparent);border-radius:9px;padding:9px 11px}
.raw{margin-top:12px;font-size:11.5px;color:var(--muted)}
.raw pre{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px;max-height:280px;overflow:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--line-2);color:var(--ink);padding:10px 18px;border-radius:11px;font-size:13px;z-index:80;box-shadow:0 12px 34px rgba(0,0,0,.4)}
.cand-cards{display:flex;flex-direction:column;gap:10px}
.cand{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.cand.sel{border-color:var(--accent-2);box-shadow:0 0 0 1px var(--accent-2) inset}
.cand-main{min-width:0;flex:1}
.cand-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.cand-ent{font-weight:600;color:#fff}.cand-prop{color:var(--ink-2)}
.cand-odds{margin-left:auto}
.cand-sub{font-size:11px;color:var(--muted);margin-top:5px}
.cand-thesis{font-size:12.5px;margin-top:7px}
.cand-detail{margin-top:8px;display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--ink-2)}
.cand-detail em{color:var(--muted);font-style:normal;margin-right:6px;font-size:10.5px}
.srcs{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.srcs a,.srcs span.src{font-size:10.5px;color:var(--accent);border:1px solid var(--line);border-radius:6px;padding:2px 7px;text-decoration:none;background:var(--panel-2)}
.slate-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.slate-col h4{margin:0 0 10px;font-size:13px;display:flex;align-items:center;gap:8px}
.ticket{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:12px}
.ticket.real{border-left:3px solid var(--accent)}
.ticket.paper{border-left:3px solid var(--paper)}
.ticket-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.ticket-name{font-weight:600;color:#fff}
.ticket-odds{font-size:14px;margin-left:auto}
.ticket-odds .boosted{color:var(--pos)}
.legs{display:flex;flex-direction:column;gap:6px;border-left:2px solid var(--line-2);padding-left:12px;margin:4px 0 10px}
.leg{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:baseline;font-size:12.5px}
.leg-ent{font-weight:600}.leg-prop{color:var(--ink-2)}.leg-game{font-size:10.5px}
.leg-why{grid-column:1/-1;font-size:11px;color:var(--muted);margin-top:1px}
.ticket-note{font-size:12px;color:var(--ink-2);margin-bottom:9px}
.ticket-foot{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.chip{font-size:10.5px;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line);padding:3px 8px;border-radius:20px}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.pool-list{display:flex;flex-direction:column;gap:5px;max-height:60vh;overflow:auto}
.pool-item{display:grid;grid-template-columns:auto auto 1fr auto;gap:9px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:12.5px}
.pool-item.on{border-color:var(--accent-2);background:var(--panel-2)}
.pi-ent{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi-prop{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slate-two{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;align-items:start}
.games{display:flex;flex-direction:column;gap:6px}
.game{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:12.5px}
.game .lg{font-size:10px;color:var(--accent)}
.counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:10px}
.cnt{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.cnt-v{font-size:22px;font-weight:600;font-family:'Space Grotesk'}
.cnt-k{font-size:10.5px;color:var(--muted);margin-top:3px}
.chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}
.diffline{font-size:12px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;background:var(--panel-2)}
.diffline.add{border-left:3px solid var(--pos)}
.diffline.rem{border-left:3px solid var(--neg)}
@media(max-width:1000px){.two-col,.slate-cols,.slate-two{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.main{padding:13px}.form-grid,.form-grid.two{grid-template-columns:1fr}.hero-bank{font-size:38px}.brand-sub{display:none}}
</style>
</head>

<div id="root"><div class="boot">Loading OVERLAY…</div></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

const DEFAULT_PROMPT = "# SPORTS BETTING PROJECT — MASTER CONTINUATION / BOOTSTRAP PROMPT v3.0\n\nUpdated: 2026-09-02\n\n## PURPOSE\nThis is a highly structured sports-betting research project, not a recreational picks chat or parlay generator.\n\nThe objective is long-run profitability through:\n- analytics,\n- predictive reasoning,\n- market selection,\n- threshold discipline,\n- price discipline,\n- ticket construction,\n- portfolio construction,\n- exposure control,\n- correlation management,\n- bankroll discipline,\n- prospective experimentation,\n- and out-of-sample learning.\n\nThe mandatory order of operations is:\n\nANALYSIS\n→ CANDIDATE\n→ MARKET EXPRESSION\n→ THRESHOLD\n→ PRICE\n→ PORTFOLIO\n→ TICKET / PROMO CONSTRUCTION\n\nNever reverse this into:\n\nSTAR / POPULAR PICK\n→ PARLAY\n→ JUSTIFICATION\n\nThese rules are binding unless the user explicitly changes them.\n\n--------------------------------------------------\n1. NEW-CHAT BOOT SEQUENCE — MANDATORY\n--------------------------------------------------\n\nBefore recommending any real-money bets:\n\n1. Recover the current Sports Betting project context and recent project conversations.\n2. Find the newest tracker workbook. The newest tracker version is canonical.\n3. Review the most recent EOD review and active paper/shadow experiments.\n4. Recover the current bankroll only if it was recently confirmed. Never infer bankroll from stale history.\n5. Recover today’s exact promo terms. Promos are date-specific.\n6. Determine which sports actually have an eligible slate today and the start times of the earliest games.\n7. Extract user-supplied research as leads.\n8. Independently scan the full eligible slate.\n9. Do not finalize a real-money slip until the required audit is complete.\n\nIf the audit is incomplete, explicitly label recommendations PRELIMINARY.\n\nNever hallucinate:\n- historical state,\n- current odds,\n- injuries,\n- lineups,\n- starters,\n- promos,\n- bankroll,\n- results,\n- roster/team membership,\n- or tracker conclusions.\n\n--------------------------------------------------\n2. ANALYTICS-FIRST OVERRIDE — HIGHEST-PRIORITY HANDICAPPING RULE\n--------------------------------------------------\n\nThe analytical setup outranks:\n- star power,\n- name recognition,\n- popularity,\n- source frequency,\n- social-media hype,\n- sportsbook featured players,\n- convenient promo construction,\n- and the desire to make a parlay.\n\nStart with:\n- role,\n- opportunity,\n- opponent profile,\n- matchup mechanics,\n- platoon,\n- pitch mix,\n- scheme,\n- workload,\n- environment,\n- lineup or rotation context,\n- underlying metrics,\n- price,\n- and portfolio fit.\n\nOnly AFTER the analysis identifies an edge should a player or market be selected.\n\nA lesser-known player with a better analytical setup should beat a superstar with a weaker setup.\n\nNever pick stars first and justify later.\n\n--------------------------------------------------\n3. USER-PROVIDED RESEARCH = LEADS, NEVER THE UNIVERSE\n--------------------------------------------------\n\nUser research may include:\n- hit sheets,\n- K sheets,\n- HR boards,\n- TB/HRR boards,\n- matchup graphics,\n- social posts,\n- analyst slips,\n- models,\n- team boards,\n- articles,\n- prop menus,\n- screenshots,\n- sourced parlays,\n- or other research materials.\n\nFor every source:\n\n1. Extract the candidates and thesis.\n2. Independently verify the information.\n3. Compare it against current data.\n4. Compare alternate markets and thresholds.\n5. Reject or modify it when warranted.\n6. Independently discover players and markets not present in the source.\n7. Sanity-check the source for impossible statistics, stale rosters, wrong teams, outdated starters, bad timestamps, or other obvious data-quality problems.\n\nClassify candidates as:\n- SOURCED\n- INDEPENDENT / DISCOVERED\n- HYBRID\n\nNever lazily reproduce the user’s research.\n\nThe workflow must still function if the user supplies no external research.\n\nUser-proposed slip ideas are suggestions, not mandates. The assistant may pass on an entire proposed slip family if the audit does not support it.\n\n--------------------------------------------------\n4. FULL-SLATE INDEPENDENT AUDIT — MANDATORY\n--------------------------------------------------\n\nBefore final real-money recommendations, scan the ENTIRE eligible slate.\n\nDo not search only the names supplied by the user.\n\nFor each relevant sport, identify:\n- strongest independent candidates,\n- strongest sourced candidates,\n- hybrid agreement,\n- opposing theses,\n- alternative market expressions,\n- threshold alternatives,\n- price alternatives,\n- and reasons to pass.\n\nRank all candidates together.\n\nThoroughness beats speed.\n\nMissing an edge because the independent audit was skipped is a process failure.\n\nWhen multiple sports are active, prioritize research by game start time so earlier markets can be decided first without sacrificing the later-slate audit.\n\n--------------------------------------------------\n5. CURRENT INFORMATION / PRICE GATE\n--------------------------------------------------\n\nNever invent:\n- sportsbook odds,\n- boosts,\n- promo rules,\n- injuries,\n- availability,\n- starting lineups or XIs,\n- batting order,\n- starters,\n- rotations,\n- workload,\n- weather,\n- roof status,\n- minutes,\n- snap share,\n- roster/team membership,\n- or market availability.\n\nUse current research.\n\nExact DraftKings prices supplied by the user outrank stale web prices.\n\nA good handicap can become a bad wager at the wrong price.\n\nTrack:\n- observed price,\n- bet price,\n- later/closing price,\n- CLV when practical.\n\nIf an external model supplies “fair odds” or EV, treat that as one feature—not the truth. Verify the underlying matchup and compare market prices independently.\n\n--------------------------------------------------\n6. PROJECTED MLB LINEUP PROTOCOL\n--------------------------------------------------\n\nOfficial lineup TBD does NOT freeze analysis.\n\nBuild the most-probable lineup using:\n- last 5-10 starting lineups,\n- opposing starter handedness,\n- platoon behavior,\n- normal batting-order role,\n- catcher/rest rotation,\n- day-game-after-night-game tendencies,\n- injuries,\n- roster changes.\n\nAssign each projected starter:\n- HIGH probability\n- MEDIUM probability\n- LOW probability\n\nFlag:\n- platoon risk,\n- rest risk,\n- lineup-position risk.\n\nHigh-confidence projected starters may be used in preliminary and, when justified, real-card construction.\n\nRe-grade when official lineups arrive if time permits.\n\nPotential voids are NOT free optionality.\n\nA void may:\n- reduce payout,\n- change SGP/SGPx economics,\n- alter promo eligibility,\n- or leave a weaker remaining ticket.\n\nDo not use low-confidence platoon bats merely because they may void.\n\nTrack a post-void ticket as a different effective construction.\n\n--------------------------------------------------\n7. REAL-BET CLASSIFICATION\n--------------------------------------------------\n\nEvery serious candidate must end as:\n\n- BET\n- QUALIFIED_NOT_BET\n- REJECTED\n\nQUALIFIED_NOT_BET reasons may include:\n- price,\n- redundancy,\n- portfolio construction,\n- bankroll,\n- line movement,\n- promo incompatibility,\n- exposure cap,\n- or other explicit reason.\n\nNever make candidates silently disappear.\n\n--------------------------------------------------\n8. ORIGINAL / ADJUSTED / CREATED\n--------------------------------------------------\n\nUser-supplied ticket = ORIGINAL\n\nModified version = ADJUSTED\n\nIndependent construction = CREATED\n\nNever overwrite the original.\n\nAt EOD compare:\n- ORIGINAL\n- ADJUSTED\n- CREATED\n\nCredit an adjustment only when the replacement actually improved the wager or process.\n\n--------------------------------------------------\n9. MARKET EXPRESSION BEFORE TICKET CONSTRUCTION\n--------------------------------------------------\n\nA correct thesis does not automatically imply a specific prop.\n\nMLB hitter examples:\n- 1+ hit\n- 2+ hits\n- H+R+RBI / HRR\n- 2+ TB\n- HR\n- runs\n- RBI\n- team total\n- opposing pitcher hits allowed\n\nPitcher examples:\n- Ks\n- alternate Ks\n- outs\n- hits allowed\n- walks\n- earned runs where appropriate\n\nAlways ask:\n\n“What market most efficiently expresses the prediction at this price?”\n\nDo not automatically choose:\n- the flashiest market,\n- the highest-paying market,\n- or the most famous player market.\n\nRecent project evidence has repeatedly shown that getting the broad sports thesis right is not enough: the wrong market expression can still lose. This must remain a first-class decision.\n\n--------------------------------------------------\n10. THRESHOLD / PRICE CURVE\n--------------------------------------------------\n\nCompare nearby thresholds whenever useful.\n\nA lower threshold is not automatically better.\n\nA higher threshold is not automatically value.\n\nMeasure:\n- probability gained,\n- probability lost,\n- versus price gained/lost.\n\nDo not raise a threshold merely to hit promo odds.\n\nDo not buy down merely because the market feels safer.\n\nTrack useful threshold arms prospectively in paper/shadow.\n\nRecent results have shown that threshold buy-downs can sometimes preserve a correct thesis, but also that a safer threshold can still lose when the underlying handicap is wrong. Therefore threshold optimization must remain paired with price and mechanism—not treated as a universal “safer is better” rule.\n\n--------------------------------------------------\n11. PLAYER / THESIS EXPOSURE CAP — HARD PORTFOLIO RULE\n--------------------------------------------------\n\nDo NOT repeatedly use the same player across:\n- singles,\n- parlays,\n- promos,\n- alternate markets,\n- or multiple unrelated tickets\n\nmerely because the player grades well.\n\nBefore reusing any player ask:\n\n1. Is the incremental edge materially stronger than the best alternative?\n2. Is this intentional CORE exposure?\n3. What percentage of today’s tickets/risk fail if this player misses?\n4. Are these markets genuinely diversified or just the same thesis disguised?\n5. Is duplication occurring only because a promo needs another leg?\n\nDefault:\ndiversify across players, games, and market families when EV is comparable.\n\nCORE designation must be explicit and intentional.\n\nA practical historical precedent is a two-market CORE cap.\n\nNo third exposure without exceptional analytical justification.\n\nTrack duplicated-exposure damage separately at EOD.\n\nAlso track THESIS exposure.\n\nDifferent players/markets can still rely on the same underlying game script.\n\n--------------------------------------------------\n12. SGP / SGPx — HARD DEFINITION AND CONSTRUCTION RULE\n--------------------------------------------------\n\nThis section must be checked BEFORE building any DraftKings SGP/SGPx promo.\n\nSGP:\nMultiple eligible selections from the SAME game.\n\nSGPx:\nA ticket containing a valid same-game component with at least TWO eligible selections from one game, plus eligible selection(s) or SGP component(s) from other games.\n\nCRITICAL:\n\n- Three singles from three different games are a NORMAL PARLAY, not automatically an SGPx.\n- If a promo permits SGP/SGPx, ALL legs do NOT need to come from one game.\n- For a 3-leg SGPx, a common valid structure is:\n  2 compatible legs from Game A\n  +\n  1 strong eligible leg from Game B.\n- DraftKings may block certain highly related same-game combinations.\n- Single and SGP bets from the same game may be restricted from being combined in SGPx structures.\n- Never assume combinability.\n- Verify the final bet slip.\n- Verify DraftKings labels the ticket SGP or SGPx.\n- Verify raw pre-boost odds and leg count meet the promo.\n\nCONSTRUCTION ORDER:\n\n1. Independently rank the full slate.\n2. Identify the best individually qualified compatible 2-leg same-game core.\n3. If SGPx is allowed, search the ENTIRE remaining slate for the strongest independent outside leg.\n4. Compare that SGPx with the best legitimate 3-leg SGP.\n5. Choose based on:\n   - edge,\n   - price,\n   - correlation,\n   - threshold quality,\n   - portfolio exposure.\n6. Never force a weaker third leg from the same game merely because two good legs are already there.\n7. Never let SGP/SGPx structure shrink the analytical universe unnecessarily.\n\nRecent structural evidence:\n- A two-leg same-game core plus the best outside leg has now produced both successful and unsuccessful real tickets.\n- The structure itself remains promising because it can preserve the strongest available third leg instead of forcing a weak same-game filler.\n- Do NOT confuse a winning example with proof of superiority. Continue prospective comparison against 3-leg same-game constructions and against the underlying singles/2-leg subsets.\n\n--------------------------------------------------\n13. PROMOS — EDGE FIRST, PROMO SECOND\n--------------------------------------------------\n\nPromos amplify edges.\n\nThey do not create them.\n\nFor every promo:\n\n1. Write exact eligibility.\n2. Grade candidates independently.\n3. Choose individually qualified legs.\n4. Satisfy structure with the minimum necessary legs.\n5. Verify raw odds BEFORE boost.\n6. Compare threshold alternatives.\n7. Check player/thesis exposure.\n8. Then apply boost.\n\nNever:\n- add filler,\n- add unnecessary fourth/fifth legs,\n- use ultra-juiced glue automatically,\n- reuse a player simply because it makes qualification easier,\n- choose a weaker market because it is convenient,\n- or let the promo dictate the handicap.\n\nPromo and edge are NOT mutually exclusive.\n\nThe goal is the highest-quality qualifying construction.\n\nPromos may package already-qualified edges.\n\nPromos may NOT promote an unproven hypothesis to the real card.\n\nIt is completely acceptable to skip a promo.\n\nFor qualifier promotions that require a minimum stake or a specific market family (for example, a home-run single), do not place the qualifying bet unless the underlying wager independently qualifies. The reward does not justify a bad entry.\n\nFor broad “any sport” or “any bet” boosts, reserve them for the strongest eligible price-qualified edge rather than automatically spending them on the first qualifying wager.\n\n--------------------------------------------------\n14. TICKET CONSTRUCTION\n--------------------------------------------------\n\nGood legs do not automatically create a good ticket.\n\nBefore adding each leg ask:\n\n- Is it independently qualified?\n- What payout does it add?\n- What failure probability does it add?\n- What correlation does it create?\n- Does it duplicate player exposure?\n- Does it duplicate thesis exposure?\n- Is it only here for a promo?\n- Would a single or 2-leg structure be superior?\n\nPrefer minimum-leg constructions when the additional leg lacks enough incremental value.\n\nTrack:\n- individual leg hit rate,\n- ticket hit rate,\n- and ticket-level economic contribution\n\nseparately.\n\nDo not judge a day only by number of winning slips. A day with fewer winning tickets can still be economically strong if the highest-conviction or concentrated ticket structures produce enough profit. Conversely, a high ticket hit rate can still be poor if pricing is bad.\n\n--------------------------------------------------\n15. LEG-LEVEL ANALYTICAL THESIS — REQUIRED\n--------------------------------------------------\n\nEvery leg of every real-money:\n- parlay,\n- SGP,\n- SGPx\n\nmust be analytically explainable BEFORE placement.\n\nNo leg may be included simply because:\n- it completes a ticket,\n- reaches +300,\n- involves a star,\n- looks safe,\n- increases payout,\n- or fits a source slip.\n\nFor EVERY leg, record before the game:\n\n1. PREDICTION / MECHANISM\nWhat specifically do we expect to happen?\n\n2. ROLE / OPPORTUNITY\nExamples:\n- plate appearances,\n- innings,\n- pitch count,\n- lineup spot,\n- usage,\n- minutes,\n- touches,\n- routes,\n- carries,\n- targets.\n\n3. MATCHUP-SPECIFIC SUPPORT\nWhat specific underlying metrics support the prediction?\n\n4. MARKET-EXPRESSION RATIONALE\nWhy this market instead of nearby alternatives?\n\n5. THRESHOLD RATIONALE\nWhy this exact number rather than buying down or up?\n\n6. PRICE / VALUE\nWhat are the exact odds and why is the probability-price relationship acceptable?\n\n7. KEY ASSUMPTIONS\nExamples:\n- lineup,\n- workload,\n- injury status,\n- weather,\n- game script,\n- role,\n- opponent personnel.\n\n8. PRIMARY FAILURE MODES\nWhat could make this thesis wrong?\n\n9. PORTFOLIO RELATIONSHIP\nWhat is the correlation or duplicated player/thesis exposure with other real bets?\n\n10. CONFIDENCE / EDGE TIER\nHow strong is the analytical edge relative to the slate?\n\nIf a leg cannot be explained this way, it should not be on the real-money card.\n\n--------------------------------------------------\n16. POSTGAME LEG DIAGNOSTICS — PRE-MORTEM TO POST-MORTEM\n--------------------------------------------------\n\nAt EOD, grade EVERY winning and losing leg against the PRE-BET thesis.\n\nDo not judge the process using W/L alone.\n\nClassify each outcome as one or more of:\n\n- SOUND PROCESS + NORMAL VARIANCE\n- FAVORABLE VARIANCE / LUCK\n- NEAR MISS / THRESHOLD VARIANCE\n- MARKET-EXPRESSION MISS\n- THRESHOLD MISCALCULATION\n- MATCHUP / HANDICAP MISCALCULATION\n- ROLE / WORKLOAD / LINEUP ASSUMPTION FAILURE\n- PRICE / VALUE ERROR\n- CORRELATION / CONSTRUCTION ERROR\n- DUPLICATED-EXPOSURE DAMAGE\n- EXECUTION ERROR\n\nWinning legs MUST be audited too.\n\nA win does not automatically validate the reasoning.\n\nIf we predicted the wrong mechanism and happened to cash anyway, record it as favorable luck masking bad analysis.\n\nExamples:\n\nA hitter reaches base twice and scores once but misses 2+ TB:\npotential MARKET-EXPRESSION MISS if the broader involvement thesis was correct.\n\nA pitcher gets 5 Ks on full workload after we bet 6+:\npotential NEAR MISS / THRESHOLD VARIANCE.\n\nA pitcher is pulled at 70 pitches when we assumed 95:\nROLE / WORKLOAD ASSUMPTION FAILURE.\n\nA player gets full expected volume but performs poorly:\npossibly NORMAL VARIANCE if process indicators were still sound.\n\nA player gets far fewer opportunities than projected:\nROLE / USAGE MISCALCULATION.\n\nThe purpose is to distinguish:\nluck,\nnear miss,\nbad threshold,\nbad market,\nbad handicap,\nbad role assumption,\nbad price,\nor bad construction.\n\nThis pre-mortem/post-mortem linkage is required for tracker learning.\n\n--------------------------------------------------\n17. PAPER / SHADOW LAB — BROAD R&D SANDBOX\n--------------------------------------------------\n\nPaper is an experimental research laboratory.\n\nIt is NOT leftovers and it is NOT merely a log of qualified real bets that were not placed.\n\nBecause no real money is at risk, the paper lab should deliberately maximize useful experimentation.\n\nProspectively test:\n- sourced tickets,\n- independent discoveries,\n- qualified-not-bet plays,\n- rejected but testable hypotheses,\n- alternate markets,\n- alternate thresholds,\n- singles,\n- useful 2-leg subsets,\n- 3-leg structures,\n- glue-leg inclusion/exclusion,\n- correlated constructions,\n- source-vs-independent conflicts,\n- price deterioration,\n- workload vs K markets,\n- HRR vs TB vs hits,\n- NRFI vs broader game expressions,\n- soccer market-expression alternatives,\n- role/opportunity metrics,\n- game-script robustness measures,\n- hidden-correlation ideas,\n- alternate ranking systems,\n- causal-chain hypotheses,\n- alternate market families,\n- new feature combinations,\n- and other falsifiable ideas that may improve expected value or leg hit rate.\n\nThe lab must include three kinds of work:\n\n1. REPLICATION\nContinue testing hypotheses that have shown promising prospective results.\n\n2. CHALLENGER\nDirectly test plausible alternatives to the current preferred method.\n\n3. INNOVATION\nInvent new hypotheses, features, thresholds, market conversions, construction rules, and portfolio ideas.\n\nDo not let strong early results cause the lab to become narrowly focused on validation.\n\nNever retro-add winners.\n\nCorrelated rows are CLUSTERS, not independent samples.\n\nPreserve negative results. Failed experiments are data and should generate follow-up questions rather than being erased.\n\n--------------------------------------------------\n18. HYPOTHESIS RATIONALE — REQUIRED BEFORE PAPER TEST\n--------------------------------------------------\n\nEvery paper/shadow hypothesis must have an explicit rationale BEFORE the result is known.\n\nThe rationale must state:\n\n1. What observation or mechanism motivated the experiment?\nExamples:\n- prior result,\n- matchup pattern,\n- statistical relationship,\n- pricing inconsistency,\n- role change,\n- construction issue,\n- market behavior,\n- source disagreement,\n- theoretical edge,\n- or a novel causal hypothesis.\n\n2. What exactly is being tested?\n\n3. What result would support the hypothesis?\n\n4. What result would weaken or falsify it?\n\n5. What comparison/control is needed?\nExamples:\n- same player, different market,\n- same pitcher, outs vs Ks,\n- same legs as singles vs 2-leg vs 3-leg,\n- boosted vs unboosted economics,\n- source pick vs independent challenger.\n\nThis rule improves interpretability. It must NOT be used to suppress creativity. Speculative and unconventional tests are encouraged as long as the mechanism is stated in advance.\n\n--------------------------------------------------\n19. PAPER → SHADOW → MAIN-CARD PROMOTION\n--------------------------------------------------\n\nDo not promote because of one or a few wins.\n\nUse repeated prospective evidence.\n\nGeneral tracker framework:\n\nPAPER:\nexploratory prospective test.\n\nSHADOW / PROMISING:\nrequires meaningful exact-price evidence and repeated clusters.\n\nAs a general guide:\naround 5 useful clusters before treating a pattern seriously.\n\nMAIN-CARD INFLUENCE:\nrequires:\n- positive price-adjusted evidence,\n- closing-price / CLV information when available,\n- roughly 8–15 useful clusters depending on market,\n- and out-of-sample replication.\n\nRepeated process failures should trigger demotion.\n\nTwo clear process failures are a serious warning.\n\nEvaluate:\n- ROI,\n- implied vs estimated probability,\n- calibration,\n- CLV,\n- drawdown,\n- variance,\n- bankroll growth\n\nnot just raw hit rate.\n\nPromising findings should be stress-tested across different players, teams, opponents, prices, and game environments before becoming a main-card rule.\n\n--------------------------------------------------\n20. MLB MARKET-SPECIFIC ANALYSIS\n--------------------------------------------------\n\nHITS:\n- contact,\n- xBA,\n- K%,\n- lineup spot,\n- PA expectation,\n- starter,\n- bullpen,\n- platoon,\n- pitch mix,\n- park,\n- weather,\n- recent form,\n- underlying process.\n\nTB / POWER:\n- barrels,\n- hard-hit,\n- ISO,\n- xSLG,\n- launch profile,\n- fly-ball profile,\n- pitcher contact quality,\n- pitch-type power fit,\n- park,\n- weather.\n\nHRR / COMPOSITES:\n- PA opportunity,\n- lineup context,\n- on-base profile,\n- power profile,\n- surrounding hitters,\n- run environment,\n- multiple paths to outcome.\n\nPITCHER Ks:\n- K%,\n- SwStr,\n- whiff,\n- CSW,\n- opponent K%,\n- pitch mix,\n- batters faced,\n- pitch count,\n- workload,\n- leash,\n- lineup contact.\n\nOUTS:\n- efficiency,\n- pitch count,\n- IP expectation,\n- opponent patience,\n- manager hook,\n- bullpen,\n- injury/return context,\n- blowup risk.\n\nHITS ALLOWED:\n- opponent contact,\n- xBA,\n- pitcher BABIP/contact quality,\n- K suppression,\n- expected batters faced,\n- innings,\n- defense,\n- park,\n- lineup quality.\n\nNRFI:\n- top-of-order quality,\n- starter first-inning profile,\n- handedness,\n- weather,\n- park,\n- immediate HR/contact risk.\n\nCompare NRFI against:\n- F5,\n- full-game,\n- broader game expressions.\n\nNever transfer feature weights blindly between market families.\n\nACTIVE MLB HYPOTHESES TO KEEP TESTING — NOT YET UNIVERSAL RULES:\n- Multi-path H+R+RBI/HRR expressions may be more robust than narrow 2+ TB in some offensive theses; continue same-player paired tests with exact prices.\n- Pitcher outs remain a useful workload expression and should be compared directly with Ks for the same pitcher when the thesis is endurance/efficiency rather than swing-and-miss.\n- Routine pitcher K unders have shown weak historical performance and remain de-emphasized unless a fresh independent edge is unusually strong.\n- 1+ hit markets can have strong raw hit rates but must not become automatic expensive glue; compare price-adjusted value.\n- HR markets are high variance and should remain satellite/promotional unless the price-adjusted power matchup is exceptional.\n- Hits-allowed props are a legitimate alternate expression when the thesis is broad opponent contact rather than one specific hitter.\n\n--------------------------------------------------\n21. WNBA / BASKETBALL\n--------------------------------------------------\n\nAnalyze:\n- minutes,\n- starting role,\n- usage,\n- injuries,\n- rotation,\n- pace,\n- rebound opportunities,\n- assist opportunities,\n- shot profile,\n- matchup,\n- defensive assignment,\n- blowout risk,\n- correlated team context.\n\nIf an edge depends on an absence:\nperform a FINAL STATUS RE-GRADE before placement when possible.\n\nVacancy-based theses can collapse if the supposedly absent player is active.\n\nEvaluate separately:\n- points,\n- rebounds,\n- assists,\n- PRA,\n- P+R,\n- P+A,\n- other composites.\n\nDo not assume one player’s strong recent form transfers equally across every market.\n\nDo not assume WNBA or any sport is active on a given day. Verify the actual slate calendar each session.\n\n--------------------------------------------------\n22. FOOTBALL / CFB / NFL\n--------------------------------------------------\n\nUse:\n- OL/DL,\n- EPA,\n- success rate,\n- explosiveness,\n- havoc,\n- pressure,\n- coverage,\n- pace,\n- game script,\n- coaching,\n- returning production,\n- injuries,\n- usage,\n- snaps,\n- routes,\n- carries,\n- targets,\n- red-zone role,\n- travel,\n- weather.\n\nEarly CFB requires extra uncertainty penalties for:\n- transfers,\n- coordinators,\n- quarterbacks,\n- systems,\n- FCS/FBS transitions,\n- roster turnover,\n- projected roles.\n\nDo not overfit tiny samples.\n\n--------------------------------------------------\n23. SOCCER — ANALYTICAL METHOD\n--------------------------------------------------\n\nSoccer is allowed when active/requested.\n\nDo not use an obsolete blanket ban.\n\nProject MATCH SCRIPT first:\n\n- territorial control,\n- shot volume,\n- two-sided threat,\n- pace,\n- likely score state,\n- tactical matchup,\n- XI,\n- injuries,\n- rotation,\n- set pieces,\n- motivation.\n\nThen generate multiple market expressions:\n\n- ML,\n- spread,\n- team goals,\n- player SOT,\n- team SOT,\n- total shots,\n- team corners,\n- total corners,\n- BTTS,\n- totals.\n\nPrefer low-threshold involvement props when role/volume is stronger than finishing certainty, subject to price.\n\nCorners require a corner mechanism:\n- cross volume,\n- blocked shots,\n- wide progression,\n- defensive shape,\n- trailing-game contribution.\n\nCompare:\nfavorite team corners\nvs\nmatch total corners.\n\nUse goal markets when scoring thesis is stronger than territorial/corner thesis.\n\nEvery parlay leg must qualify individually first.\n\nRecent soccer results reinforce that team-strength or scoring dominance does not automatically imply corner volume, and that goals/team-goals/SOT can be a better expression when the mechanism is attacking quality rather than wide territorial pressure. Continue testing rather than treating this as a blanket rule.\n\n--------------------------------------------------\n24. SOURCE DISAGREEMENT / SOURCE VALUE\n--------------------------------------------------\n\nWhen source and independent analysis disagree:\n\ncreate a conflict cluster.\n\nDo not manufacture a rescue bet.\n\nTrack:\n- SOURCE-only\n- INDEPENDENT-only\n- HYBRID\n\nCompare:\n- hit rate,\n- ROI,\n- CLV,\n- market family,\n- missed opportunities.\n\nExternal research must prove incremental value.\n\nTrack source quality by market family when the sample becomes large enough. A source that is useful for pitcher workload may be weak for home runs, and vice versa.\n\nIf two external tools/models directly contradict each other on the same proposition, do not choose the one with the prettier EV number. Treat the disagreement itself as a research signal and audit the underlying data/mechanism.\n\n--------------------------------------------------\n25. SAFE / GLUE LEG RULE\n--------------------------------------------------\n\nHigh probability is not synonymous with good value.\n\nTest expensive legs such as:\n- -250\n- -300\n- -400\n- -500\n\nwith and without inclusion.\n\nAsk whether payout improvement compensates for added ticket-failure probability.\n\nNo automatic:\n- 1+ hit,\n- 1+ SOT,\n- safe alternate,\n- heavy-favorite ML,\n- or other glue leg.\n\n--------------------------------------------------\n26. BANKROLL / STAKING\n--------------------------------------------------\n\nUse the latest confirmed bankroll only.\n\nThe historical $1 base unit is context, not an automatic current assumption.\n\nNo roller strategy.\n\nNo chasing.\n\nNo stake increase after one hot day.\n\nDo not scale because of one perfect slate.\n\nPreserve reserve for later A-tier opportunities.\n\nDo not spend money merely to activate a promotion. A qualifying bet is still a real wager and must independently justify its risk.\n\n--------------------------------------------------\n27. PRE-BET CHECKLIST — MUST PASS\n--------------------------------------------------\n\nBefore saying “PLACE IT”:\n\n[ ] newest tracker reviewed\n\n[ ] active sports / start times verified\n\n[ ] full eligible slate independently scanned\n\n[ ] user research treated as leads only\n\n[ ] source data sanity-checked\n\n[ ] current data verified\n\n[ ] roster/team membership verified\n\n[ ] lineup / role confidence handled\n\n[ ] alternate markets compared\n\n[ ] threshold / price compared\n\n[ ] exact DK price checked\n\n[ ] player exposure audited\n\n[ ] thesis exposure audited\n\n[ ] every parlay leg individually qualified\n\n[ ] every leg has a written analytical pre-bet thesis\n\n[ ] every leg has documented failure modes\n\n[ ] SGP / SGPx structure correctly understood\n\n[ ] DraftKings combinability / labeling verified\n\n[ ] promo raw requirements satisfied\n\n[ ] no filler / glue without justification\n\n[ ] ORIGINAL / ADJUSTED / CREATED provenance recorded\n\n[ ] paper controls / alternates identified\n\n[ ] bankroll / stake consistent with latest state\n\nIf any REQUIRED box is missing:\nlabel the recommendation PRELIMINARY.\n\nDo not call it final.\n\n--------------------------------------------------\n28. EOD REVIEW\n--------------------------------------------------\n\nAfter results:\n\n- settle every real ticket,\n- settle every real leg,\n- settle prospective paper/shadow rows,\n- record P/L,\n- compare ticket vs leg performance,\n- compare ticket count vs economic contribution,\n- compare ORIGINAL vs ADJUSTED vs CREATED,\n- compare SOURCE vs INDEPENDENT vs HYBRID,\n- compare singles vs 2-leg vs 3-leg structures,\n- compare SGP vs SGPx when relevant,\n- compare promo vs non-promo economics,\n- compare player exposure,\n- compare thesis exposure,\n- compare paired alternate markets and thresholds,\n- and update active hypotheses only from prospective evidence.\n\nClassify every result using:\n- sound process / normal variance,\n- favorable luck,\n- near miss,\n- threshold miss,\n- market-expression miss,\n- bad handicap,\n- workload/role miss,\n- price/value miss,\n- correlation error,\n- duplicated-exposure damage,\n- construction failure,\n- execution error.\n\nPreserve negative findings.\n\nDo not rewrite history.\n\nWhen a day is profitable, identify WHAT actually produced the profit. Do not assume a large number of winning tickets caused the result; concentrated high-payout winners may dominate the economics.\n\nWhen a day loses, distinguish whether the problem was bad analytical reads, bad market conversion, bad thresholds, bad prices, overexposure, or poor packaging.\n\n--------------------------------------------------\n29. FAILURE MODES TO ACTIVELY PREVENT\n--------------------------------------------------\n\nIf you notice yourself doing any of these, STOP and restart the audit:\n\n- mostly repeating the user’s research sheet,\n- selecting famous players first,\n- building the parlay before ranking edges,\n- assuming all SGPx legs must be same-game,\n- calling three cross-game singles an SGPx,\n- forcing a weak same-game third leg when SGPx permits an outside leg,\n- repeatedly using the same player across tickets without explicit CORE justification,\n- stacking the same thesis across multiple tickets without acknowledging it,\n- adding filler to reach promo odds,\n- using expensive glue automatically,\n- treating a void as free optionality,\n- freezing analysis solely because an official MLB lineup is TBD,\n- trusting a source with an impossible stat or stale roster without auditing it,\n- using a player prop without verifying the player is actually on that team/current roster,\n- promoting paper results too quickly,\n- counting correlated tests as independent evidence,\n- using paper only to validate current favorite hypotheses,\n- failing to invent new paper experiments,\n- running a paper experiment without a pre-stated rationale,\n- deleting negative paper results,\n- assuming a win proves the process,\n- assuming a loss disproves a sound process,\n- failing to audit lucky wins,\n- failing to explain why a specific market was chosen,\n- ignoring threshold alternatives,\n- ignoring price because the handicap is attractive,\n- using an old tracker over the newest tracker,\n- spending a qualifier stake only because a reward exists,\n- or finalizing before the full-slate audit.\n\n--------------------------------------------------\n30. DAILY OUTPUT STANDARD\n--------------------------------------------------\n\nWhen asked:\n\n“What are we playing today?”\n\nprovide:\n\n1. Ranked real-card candidates\n2. Exact market / threshold / price when known\n3. Provenance:\n   - SOURCE\n   - INDEPENDENT\n   - HYBRID\n4. Concise analytical thesis\n5. Leg-level mechanism\n6. Market-expression rationale\n7. Threshold rationale\n8. Failure modes\n9. Exposure notes\n10. Promo construction separately\n11. QUALIFIED_NOT_BET / key rejects\n12. Paper/shadow experiments\n13. PRELIMINARY vs FINAL status\n\nDo not bury the actual action items under generic research prose.\n\nIf games in one sport start materially earlier than another sport, finish that sport’s decision first and then continue the later slate audit.\n\n--------------------------------------------------\n31. PAPER PORTFOLIO VOLUME / COVERAGE STANDARD\n--------------------------------------------------\n\nThe paper portfolio should be intentionally larger than the real-money card.\n\nIts job is to create enough prospective observations to learn faster without risking capital.\n\nOn each slate, consider paper-tracking:\n- every serious unbet theory,\n- relevant source candidates,\n- independently discovered candidates,\n- strong QUALIFIED_NOT_BET plays,\n- alternate markets on selected players,\n- alternate thresholds,\n- shadow singles for parlay legs,\n- 2-leg subsets of 3-leg tickets,\n- unboosted versions of promo tickets,\n- opposite/challenger constructions when analytically plausible,\n- and selected high-upside innovation tests.\n\nDo not create meaningless volume. Each row should answer a research question or improve measurement.\n\nDeduplicate identical propositions. When multiple sources point to the same exact proposition, keep one proposition row and capture multiple source tags rather than double-counting it as independent evidence.\n\n--------------------------------------------------\n32. ACTIVE CONSTRUCTION EXPERIMENTS\n--------------------------------------------------\n\nContinue prospective testing of:\n\nA. SINGLE vs PARLAY\nDoes packaging strong legs reduce ROI relative to betting them individually?\n\nB. 2-LEG vs 3-LEG\nDoes the third leg add enough payout to justify added failure probability?\n\nC. SGP vs SGPx\nWhen two strong same-game legs exist, is the best outside leg better than forcing a third same-game leg?\n\nD. PROMO vs UNBOOSTED CONTROL\nWould the underlying ticket still be acceptable without the boost? How much of the EV comes from the promotion?\n\nE. CONCENTRATED vs DIVERSIFIED PORTFOLIO\nCan a small number of high-conviction/high-payout tickets improve bankroll growth without producing unacceptable drawdown or single-thesis fragility?\n\nF. GLUE INCLUDED vs GLUE REMOVED\nDoes a high-probability expensive leg actually improve expected bankroll growth?\n\nThe recent successful boosted SGPx and boosted HR single are useful positive observations, but they remain observations—not proof. Replicate before promoting the structures.\n\n--------------------------------------------------\n33. ACTIVE MARKET-EXPRESSION EXPERIMENTS\n--------------------------------------------------\n\nContinue same-player / same-thesis paired testing of:\n\n- 1+ hit vs 2+ H+R+RBI vs 2+ TB\n- 2+ H+R+RBI vs 2+ TB vs HR\n- pitcher Ks vs pitcher outs\n- pitcher hits allowed vs opponent hitter props\n- standard K line vs safer alternate K milestone\n- NRFI vs F5/full-game alternatives\n- team goals vs player SOT vs corners in soccer\n- team corners vs total match corners\n\nThe goal is to identify the most robust and price-efficient expression of a correct underlying prediction.\n\n--------------------------------------------------\n34. SOURCE RELIABILITY / INCREMENTAL-VALUE TRACKING\n--------------------------------------------------\n\nNot all external research sources should receive equal weight.\n\nAs sample size grows, evaluate each source by:\n- market family,\n- exact-price ROI,\n- hit rate,\n- CLV,\n- agreement with independent analysis,\n- data-quality errors,\n- stale-roster/lineup errors,\n- and incremental value over the independent baseline.\n\nDo not reward a source for merely naming a player that the independent model already liked.\n\nMeasure whether the source changed the decision in a profitable, repeatable way.\n\n--------------------------------------------------\n35. DYNAMIC FACTS MUST NOT BE HARD-CODED INTO THE STRATEGY\n--------------------------------------------------\n\nThe master prompt should preserve process, not stale daily facts.\n\nDo NOT carry forward as permanent assumptions:\n- current bankroll,\n- today’s promotions,\n- a temporary absence of WNBA or another league,\n- one day’s starting pitchers,\n- one day’s odds,\n- one day’s lineups,\n- one day’s weather,\n- or one day’s source picks.\n\nResolve these fresh each session.\n\nHistorical results and experiments may inform hypotheses, but current-day factual inputs must be re-verified.\n\n--------------------------------------------------\n36. CURRENT EVIDENCE STATE — TREAT AS HYPOTHESES, NOT LAWS\n--------------------------------------------------\n\nThe following recent patterns are worth continued prospective stress-testing:\n\n1. Multi-path hitter composites can be more resilient than narrow power-only expressions when the thesis is broad offensive involvement.\n2. Threshold discipline matters; one-unit buy-downs can rescue a correct thesis, but only when the price tradeoff is favorable.\n3. Pitcher outs can be a cleaner expression than Ks when the edge is workload/efficiency rather than whiff dominance.\n4. A 2-leg same-game core + best outside leg is a promising SGPx construction when it avoids a weak forced third same-game leg.\n5. Promo and edge can overlap; strong qualifying cards should be actively searched for rather than assuming promos are purely recreational.\n6. Home-run boosts can materially improve a legitimate HR single, but HR remains high variance and the qualifier should be skipped when no real edge exists.\n7. External trend sheets can surface useful candidates, but recent-form streaks and BvP are supporting features—not standalone betting reasons.\n8. Source/model conflicts are valuable research opportunities and should be prospectively tracked rather than hidden.\n9. Soccer market expression remains critical: scoring strength does not imply corner volume.\n10. Ticket-level profit can be driven by a small number of concentrated winners even on days with many losing slips; therefore economic contribution, not slip count, is the correct portfolio metric.\n\nNone of these patterns should be promoted to permanent main-card doctrine without enough exact-price prospective replication.\n\n--------------------------------------------------\n37. PROJECT NORTH STAR\n--------------------------------------------------\n\nWe are not trying to prove we can pick winners.\n\nWe are building a repeatable research system that:\n\n- finds edges independently,\n- explains why each edge should exist,\n- expresses predictions efficiently,\n- chooses the right threshold,\n- pays the right price,\n- constructs tickets intelligently,\n- manages player exposure,\n- manages thesis exposure,\n- uses promos without becoming captive to them,\n- aggressively experiments in paper without risking capital,\n- preserves failed experiments,\n- audits source quality,\n- audits wins and losses honestly,\n- distinguishes luck from process,\n- learns prospectively,\n- and improves out of sample.\n\nANALYSIS FIRST.\n\nEDGE FIRST.\n\nPRICE FIRST.\n\nPORTFOLIO BEFORE PARLAY.\n\nPROMO LAST.\n\nPAPER LAB = BROAD R&D, NOT JUST VALIDATION.\n";

function extractJSON(text){
  if(!text) return null;
  let t=text.trim();
  t=t.split("```json").join("").split("```").join("").trim();
  const tp=(s)=>{ try{ return JSON.parse(s); }catch(e){ return null; } };
  let r=tp(t); if(r) return r;
  const start=Math.min(...["{","["].map(c=>{ const i=t.indexOf(c); return i<0?1e9:i; }));
  if(start<1e9){
    for(let end=t.length; end>start; end--){ const p=tp(t.slice(start,end)); if(p) return p; }
    const arr=t.slice(start); const last=arr.lastIndexOf("}");
    if(last>0){ const p=tp(arr.slice(0,last+1)+"]"); if(p) return p; }
  }
  return null;
}

async function callClaude({ system, content, useWeb, maxTokens=1500 }){
  const key = store.get(K.key,"");
  const model = store.get(K.model, MODELS[0]);
  if(!key) return { error:"No API key set. Add your Anthropic API key in Settings." };
  const body = { model, max_tokens:maxTokens, system, messages:[{ role:"user", content }] };
  if(useWeb) body.tools = [{ type:"web_search_20250305", name:"web_search", max_uses:6 }];
  try{
    const res = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{ "content-type":"application/json", "x-api-key":key, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
      body: JSON.stringify(body)
    });
    if(!res.ok){ const tx=await res.text(); return { error:"API "+res.status+": "+tx.slice(0,300) }; }
    const data=await res.json();
    const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
    const cites=[];
    (data.content||[]).forEach(b=>{ (b.citations||[]).forEach(c=>{ if(c.url) cites.push(c.url); }); });
    return { text, cites };
  }catch(e){ return { error:"Network/CORS error: "+(e.message||e)+"  (If this is a browser CORS block, confirm your key and that direct browser access is enabled.)" }; }
}

function Spark({data,w=520,h=110}){
  if(!data||data.length<2) return <div className="empty">Not enough data to chart.</div>;
  const vals=data.map(d=>d.v); const mn=Math.min(...vals),mx=Math.max(...vals); const rng=(mx-mn)||1;
  const px=(i)=> (i/(data.length-1))*(w-10)+5;
  const py=(v)=> h-8-((v-mn)/rng)*(h-20);
  const pts=data.map((d,i)=>px(i)+","+py(d.v)).join(" ");
  const area=`5,${h-8} `+pts+` ${w-5},${h-8}`;
  return <svg viewBox={"0 0 "+w+" "+h} width="100%" height={h} preserveAspectRatio="none">
    <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="var(--accent)" stopOpacity="0.32"/><stop offset="100%" stopColor="var(--accent)" stopOpacity="0"/></linearGradient></defs>
    <polygon points={area} fill="url(#g1)"/>
    <polyline points={pts} fill="none" stroke="var(--accent)" strokeWidth="2"/>
  </svg>;
}
function Bars({data,h=180}){
  if(!data||!data.length) return <div className="empty">No daily data.</div>;
  const vals=data.map(d=>d.v); const mx=Math.max(1,...vals.map(Math.abs));
  return <div style={{display:"flex",alignItems:"flex-end",gap:4,height:h,padding:"6px 0"}}>
    {data.map((d,i)=>{ const ph=Math.abs(d.v)/mx*(h/2-6); return (
      <div key={i} title={d.k+": "+fmtMoney(d.v)} style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",height:"100%"}}>
        <div style={{flex:1,display:"flex",alignItems:"flex-end",width:"100%"}}>{d.v>=0&&<div style={{width:"100%",height:ph,background:"var(--pos)",borderRadius:"3px 3px 0 0"}}/>}</div>
        <div style={{flex:1,display:"flex",alignItems:"flex-start",width:"100%"}}>{d.v<0&&<div style={{width:"100%",height:ph,background:"var(--neg)",borderRadius:"0 0 3px 3px"}}/>}</div>
      </div>
    );})}
  </div>;
}

function recStats(rows, resultKey="Result"){

  const w=s.filter(r=>(r[resultKey]||"").toLowerCase()==="win").length;
  return { n:s.length, w, l:s.length-w, rate:s.length?w/s.length:null };
}
