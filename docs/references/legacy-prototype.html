    const srcLabel = srcType+(handle?" @"+handle.replace(/^@/,""):"");
    const content=
`CONTEXT
Date: ${date}
League(s): ${league}
Confirmed bankroll: ${meta.bankroll!=null?"$"+meta.bankroll:"unknown — do not infer"}
Today's promos/boosts (verbatim):
${promo||"(none)"}

EXTERNAL RESEARCH — source: ${srcLabel} (LEADS ONLY; verify, expand, independently discover; sanity-check for stale rosters/impossible stats):
${research||"(none provided — run an independent audit)"}

TASK
${useWeb?"Use web search to verify current lines, roles, injuries, lineups and to confirm today's slate. Cite the exact source URL for each key stat.":"Reason from the provided leads and your knowledge; mark anything unverified as PRELIMINARY."}
Apply the full order of operations. Produce up to 6 graded candidates (mix SOURCED/HYBRID and at least one INDEPENDENT discovery). Choose the most efficient market expression and a defensible threshold. Explain each pick simply.
Return STRICT JSON ONLY (no markdown). Keep text fields under ~180 chars.
{"candidates":[{"date":"${date}","sport":"","league":"${league}","game":"","entity":"","marketFamily":"","proposition":"","line":"","odds":"","provenance":"SOURCED|INDEPENDENT|HYBRID","tier":"A+|A|A-|B+|B|B-|C|PASS","decision":"BET|QUALIFIED_NOT_BET|REJECTED","why":"plain-language reason this leg","mechanism":"","marketExpression":"why this market vs alternatives","thresholdRationale":"","priceNote":"","failureModes":"","exposureNote":"","suggest":"REAL|PAPER","sources":["url or source name"]}]}`;
    const r=await callClaude({ system: store.get(K.prompt,DEFAULT_PROMPT), content, useWeb });
    setLoading(false);
    if(r.error){ setErr(r.error); return; }
    setRaw(r.text);
    const parsed=extractJSON(r.text); const arr=parsed?.candidates||(Array.isArray(parsed)?parsed:[]);
    if(!arr.length){ setErr("Parsed no candidates. See raw output below."); return; }
    setCards(arr.map(c=>({ ...c, _sel:true, _src:srcLabel, _cites:r.cites||[] })));
  };

  const toCand=(c)=>({ _id:uid("c_"), Date:c.date||date, "Candidate ID":"", "Source Bucket":(c.provenance||"SOURCED").replace("INDEPENDENT","DISCOVERED"), "Source / Research Set":c._src||"AI", Sport:c.sport||league, League:c.league||league, Game:c.game||"", Entity:c.entity||"", "Market Family":c.marketFamily||"Other", "Bet / Proposition":c.proposition||"", Line:c.line||"", "Odds (American)":c.odds||"", Decision:c.decision||"BET", "Placed?":"N", Result:"", "Loss Classification":"", Tier:c.tier||"", Why:c.why||"", Thesis:[c.mechanism].filter(Boolean).join(""), Sources:(c.sources||[]).concat(c._cites||[]).join(" | "), Notes:[c.marketExpression&&("Market: "+c.marketExpression),c.thresholdRationale&&("Threshold: "+c.thresholdRationale),c.priceNote&&("Price: "+c.priceNote),c.failureModes&&("Fails: "+c.failureModes),c.exposureNote&&("Exposure: "+c.exposureNote)].filter(Boolean).join(" | ") });
  const toPaper=(c)=>({ _id:uid("p_"), Date:c.date||date, "Paper ID":"", Portfolio:"PAPER", Sport:c.sport||league, Game:c.game||"", Entity:c.entity||"", "Market Family":c.marketFamily||"Other", Proposition:c.proposition||"", "Odds (American)":c.odds||"", "Source Bucket":(c.provenance||"SOURCED").replace("INDEPENDENT","DISCOVERED"), "Model Tier":c.tier||"", Result:"", "Loss Classification":"", "Experiment ID":"", Why:c.why||"", "Pre-Game Hypothesis":[c.mechanism].filter(Boolean).join(""), Sources:(c.sources||[]).concat(c._cites||[]).join(" | "), Notes:[c.marketExpression,c.thresholdRationale,c.priceNote].filter(Boolean).join(" | ") });

  const add=(asPaper)=>{ const sel=cards.filter(c=>c._sel); if(!sel.length){ flash("Nothing selected"); return; } if(asPaper) savePaper([...sel.map(toPaper),...paper]); else saveCand([...sel.map(toCand),...cand]); flash(sel.length+" added to "+(asPaper?"paper":"candidate log")); };

  return (
    <div className="two-col" style={{gridTemplateColumns:"minmax(340px,430px) 1fr"}}>
      <div>
        <Panel title="Intake &amp; grade" right={<span className="hint">runs your prompt</span>}>
          <div className="form-grid two">
            <Field label="Source"><select value={srcType} onChange={e=>setSrcType(e.target.value)}>{SOURCE_TYPES.map(s=><option key={s}>{s}</option>)}</select></Field>
            <Field label="Handle / label"><input value={handle} onChange={e=>setHandle(e.target.value)} placeholder="@user or sheet name"/></Field>
            <Field label="League"><select value={league} onChange={e=>setLeague(e.target.value)}>{LEAGUES.map(s=><option key={s}>{s}</option>)}</select></Field>
            <Field label="Date"><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></Field>
          </div>
          <Field label="Paste research — tweets, ChatGPT/Claude analysis, prop menus, hit sheets (leads only)"><textarea rows={7} value={research} onChange={e=>setResearch(e.target.value)} placeholder="Paste from X.com, ChatGPT, Claude, or a sheet…"/></Field>
          <Field label="Promos / boosts (verbatim)"><textarea rows={2} value={promo} onChange={e=>setPromo(e.target.value)} placeholder="DK 50% SGPx, 3+ legs, +300 min…"/></Field>
          <label className="chk" style={{margin:"2px 0 10px"}}><input type="checkbox" checked={useWeb} onChange={e=>{ setUseWeb(e.target.checked); store.set(K.web,e.target.checked); }}/> use web search (verify lines &amp; cite sources)</label>
          <div className="form-actions"><span className="hint">{meta.bankroll!=null?"Bankroll $"+meta.bankroll:"Bankroll unset"}</span><div className="grow"/><button className="btn primary" disabled={loading} onClick={run}>{loading?"Analyzing…":"Grade candidates"}</button></div>
          {err&&<div className="err">{err}</div>}
        </Panel>
      </div>
      <div>
        {cards.length>0&&<div className="row-flex" style={{marginBottom:12}}>
          <label className="chk"><input type="checkbox" checked={cards.every(c=>c._sel)} onChange={e=>setCards(cards.map(c=>({...c,_sel:e.target.checked})))}/> select all</label>
          <div className="grow"/>
          <button className="btn paper small" onClick={()=>add(true)}>+ Paper</button>
          <button className="btn primary small" onClick={()=>add(false)}>+ Candidate log</button>
        </div>}
        <div className="cand-cards">
          {cards.map((c,i)=>(
            <div className={"cand"+(c._sel?" sel":"")} key={i}>
              <label style={{paddingTop:2}}><input type="checkbox" checked={!!c._sel} onChange={e=>setCards(cards.map((x,j)=>j===i?{...x,_sel:e.target.checked}:x))}/></label>
              <div className="cand-main">
                <div className="cand-top"><Badge color={tierColor(c.tier)}>{c.tier}</Badge><span className="cand-ent">{c.entity}</span><span className="cand-prop">{c.proposition}</span><span className="mono cand-odds">{fmtOdds(c.odds)}</span></div>
                <div className="cand-sub mono">{c.league||c.sport} · {c.game} · {c.marketFamily} · <span style={{color:"var(--accent)"}}>{c.provenance}</span> · <span className="dec" data-d={c.decision}>{c.decision}</span> · <Badge color={c.suggest==="PAPER"?"var(--paper)":"var(--accent)"}>{c.suggest||"—"}</Badge></div>
                {c.why&&<div className="cand-thesis"><strong>Why:</strong> {c.why}{c.mechanism?" — "+c.mechanism:""}</div>}
                <div className="cand-detail">
                  {c.marketExpression&&<div><em>Market</em>{c.marketExpression}</div>}
                  {c.thresholdRationale&&<div><em>Threshold</em>{c.thresholdRationale}</div>}
                  {c.priceNote&&<div><em>Price</em>{c.priceNote}</div>}
                  {c.failureModes&&<div><em>Fails if</em>{c.failureModes}</div>}
                  {c.exposureNote&&<div><em>Exposure</em>{c.exposureNote}</div>}
                </div>
                <SrcChips items={(c.sources||[]).concat(c._cites||[])}/>
              </div>
            </div>
          ))}
          {!loading&&!cards.length&&!err&&<Empty msg="Grade candidates to see A/B-tiered legs — each with a plain-language why, market-expression, threshold, price, failure modes, and the exact sources it used. Then send them to your candidate log or paper lab."/>}
          {raw&&!cards.length&&<details className="raw"><summary>Raw model output</summary><pre>{raw}</pre></details>}
        </div>
      </div>
    </div>
  );
}

// ============================================================ SLATE
function Slate({ctx}){
  const { cand,meta,saveTix,savePaper,tix,paper,flash }=ctx;
  const pool=useMemo(()=>cand.filter(c=>c.Decision!=="REJECTED"),[cand]);
  const [sel,setSel]=useState({});
  const [boost,setBoost]=useState(""); const [minLegs,setMinLegs]=useState(""); const [minOdds,setMinOdds]=useState("");
  const [structures,setStructures]=useState("SGP, SGPx, parlay, single");
  const [useWeb,setUseWeb]=useState(store.get(K.web,true));
  const [loading,setLoading]=useState(false); const [err,setErr]=useState(null); const [raw,setRaw]=useState(null);
  const [out,setOut]=useState(null);
  // find slate
  const [sday,setSday]=useState(todayISO()); const [leaguesSel,setLeaguesSel]=useState({MLB:true,WNBA:true});
  const [games,setGames]=useState([]); const [gload,setGload]=useState(false); const [gerr,setGerr]=useState(null);

  const chosen=pool.filter(c=>sel[c._id]);
  const toggle=(id)=>setSel(s=>({...s,[id]:!s[id]}));

  const findSlate=async()=>{
    const ls=Object.keys(leaguesSel).filter(k=>leaguesSel[k]);
    if(!ls.length){ setGerr("Pick at least one league."); return; }
    setGload(true); setGerr(null); setGames([]);
    const content=`Use web search to list today's (${sday}) scheduled games for these leagues: ${ls.join(", ")}. Include start times (local US/Eastern if known) and confirm each is actually on the slate for that date. Return STRICT JSON only: {"games":[{"league":"","away":"","home":"","start":"","note":""}]}. If a league has no games that date, omit it. Cite nothing in the JSON.`;
    const r=await callClaude({ system:"You are a precise sports-schedule lookup. Verify with web search; never invent games.", content, useWeb:true, maxTokens:1500 });
    setGload(false);
    if(r.error){ setGerr(r.error); return; }
    const p=extractJSON(r.text); const g=p?.games||[];
    if(!g.length){ setGerr("No games parsed. Try fewer leagues or check the date. Raw: "+(r.text||"").slice(0,200)); return; }
    setGames(g);
  };

  const build=async()=>{
    if(chosen.length<2){ setErr("Select at least 2 candidates."); return; }
    setLoading(true); setErr(null); setOut(null); setRaw(null);
    const poolText=chosen.map(c=>`- [${c.Tier||"?"}] ${c.Entity} ${c["Bet / Proposition"]} @ ${fmtOdds(c["Odds (American)"])} | ${c.Sport||c.League} ${c.Game} | ${c["Market Family"]} | ${c["Source Bucket"]}`).join("\n");
    const content=
`CONTEXT
Bankroll: ${meta.bankroll!=null?"$"+meta.bankroll:"unknown"} | base unit: $${meta.unit||1}
PROMO/BOOST: ${boost||"none"}${minLegs?` | min legs ${minLegs}`:""}${minOdds?` | min raw odds ${minOdds}`:""}
Allowed structures: ${structures}

GRADED CANDIDATE POOL (already analyzed — construct, do not re-pick stars):
${poolText}

TASK
Produce TWO slates.
1) REAL slate: the disciplined main card. Portfolio-before-parlay; hard two-market CORE exposure cap; minimum-leg constructions; no filler; correct SGP vs SGPx (SGPx needs a >=2-leg same-game core PLUS an outside leg; three cross-game singles = normal parlay); verify raw odds meet the promo BEFORE the boost. It is fine to recommend few or zero real tickets.
2) PAPER slate: broad R&D per the paper-lab standard — alternate markets/thresholds, shadow singles for real legs, 2-leg subsets, unboosted controls, challenger constructions, source-vs-independent conflicts. Larger than the real card. Each row must answer a research question.
Give every leg a plain-language "why". Flag duplicated player/thesis exposure.
Return STRICT JSON ONLY (no markdown), text fields under ~160 chars:
{"real":[{"name":"","type":"SINGLE|SGP|SGPx|PARLAY","legs":[{"entity":"","proposition":"","odds":"","game":"","why":""}],"rawOdds":"","boostedOdds":"","stake":"","rationale":"","exposureNote":"","promoFit":""}],"paper":[{"name":"","type":"","legs":[{"entity":"","proposition":"","odds":"","game":"","why":""}],"rawOdds":"","experiment":"what this tests","rationale":""}],"rejects":[{"entity":"","proposition":"","reason":""}],"notes":""}`;
    const r=await callClaude({ system: store.get(K.prompt,DEFAULT_PROMPT), content, useWeb, maxTokens:2000 });
    setLoading(false);
    if(r.error){ setErr(r.error); return; }
    setRaw(r.text);
    const p=extractJSON(r.text);
    if(!p||(!p.real&&!p.paper)){ setErr("Could not parse slates. See raw output."); return; }
    setOut(p);
  };

  const exposureWarn=(tickets)=>{ const cnt={}; (tickets||[]).forEach(t=>(t.legs||[]).forEach(l=>{ const k=(l.entity||"").trim(); if(k) cnt[k]=(cnt[k]||0)+1; })); return Object.entries(cnt).filter(([k,v])=>v>2).map(([k,v])=>k+" ×"+v); };

  const saveReal=(t)=>{ const legs=t.legs||[]; const rawCombo=t.rawOdds||combineAm(legs.map(l=>l.odds)); saveTix([{ _id:uid("t_"), Date:todayISO(), "Ticket ID":"", Origin:"CREATED", Description:t.name||legs.map(l=>l.entity+" "+l.proposition).join(" + "), Stake:String(num(t.stake)||meta.unit||1), "Odds (American)":t.boostedOdds||rawCombo||"", "Boosted?":t.boostedOdds?"Y":"N", Legs:String(legs.length||1), Result:"", "Loss Classification":"", Payout:"", "P/L":"", "Promo / Special":boost||"", "Execution Note":[t.rationale,t.exposureNote,t.promoFit].filter(Boolean).join(" | ") },...tix]); flash("Saved to real tickets"); };
  const savePaperT=(t)=>{ const legs=t.legs||[]; savePaper([...legs.map(l=>({ _id:uid("p_"), Date:todayISO(), "Paper ID":"", Portfolio:"PAPER", Sport:"", Game:l.game||"", Entity:l.entity||"", "Market Family":"", Proposition:l.proposition||"", "Odds (American)":l.odds||"", "Source Bucket":"DISCOVERED", "Model Tier":"", Result:"", "Loss Classification":"", "Experiment ID":t.experiment||t.name||"", Why:l.why||"", "Pre-Game Hypothesis":t.rationale||"", Sources:"", Notes:t.name||"" })),...paper]); flash("Paper ticket legs saved to paper log"); };

  const realWarn=out?exposureWarn(out.real):[];

  return (
    <div>
      <Panel title="Today's slate" right={<span className="hint">web-verified schedule</span>}>
        <div className="row-flex" style={{flexWrap:"wrap",gap:8,marginBottom:10}}>
          <input type="date" className="search" style={{maxWidth:160,flex:"none"}} value={sday} onChange={e=>setSday(e.target.value)}/>
          <div className="grow"/>
          <button className="btn primary small" disabled={gload} onClick={findSlate}>{gload?"Searching…":"Find today's slate"}</button>
        </div>
        <div className="row-flex" style={{flexWrap:"wrap",gap:6,marginBottom:10}}>
          {LEAGUES.map(l=><label key={l} className="chk" style={{border:"1px solid var(--line)",borderRadius:20,padding:"4px 10px"}}><input type="checkbox" checked={!!leaguesSel[l]} onChange={e=>setLeaguesSel(s=>({...s,[l]:e.target.checked}))}/>{l}</label>)}
        </div>
        {gerr&&<div className="err">{gerr}</div>}
        {games.length>0&&<div className="games">{games.map((g,i)=>(<div className="game" key={i}><span className="lg mono">{g.league}</span><span>{g.away} @ {g.home}</span><span className="mono dim">{g.start}</span></div>))}</div>}
      </Panel>

      <div className="slate-two">
        <Panel title="Candidate pool" right={<span className="hint">{chosen.length} selected</span>}>
          {pool.length===0?<Empty msg="No candidates yet. Generate them in Research or add in Log."/>:
          <div className="pool-list">{pool.map(c=>(
            <label className={"pool-item"+(sel[c._id]?" on":"")} key={c._id}><input type="checkbox" checked={!!sel[c._id]} onChange={()=>toggle(c._id)}/><Badge color={tierColor(c.Tier)}>{c.Tier||"?"}</Badge><span className="pi-ent">{c.Entity}</span><span className="pi-prop">{c["Bet / Proposition"]}</span><span className="mono">{fmtOdds(c["Odds (American)"])}</span></label>
          ))}</div>}
        </Panel>

        <div>
          <Panel title="Promo &amp; construction">
            <Field label="Boost / promo terms"><input value={boost} onChange={e=>setBoost(e.target.value)} placeholder="DK 50% SGPx"/></Field>
            <div className="form-grid two"><Field label="Min legs"><input value={minLegs} onChange={e=>setMinLegs(e.target.value)} placeholder="3"/></Field><Field label="Min raw odds"><input value={minOdds} onChange={e=>setMinOdds(e.target.value)} placeholder="+300"/></Field></div>
            <Field label="Allowed structures"><input value={structures} onChange={e=>setStructures(e.target.value)}/></Field>
            <div className="form-actions"><label className="chk"><input type="checkbox" checked={useWeb} onChange={e=>{setUseWeb(e.target.checked);store.set(K.web,e.target.checked);}}/> web verify</label><div className="grow"/><button className="btn primary" disabled={loading} onClick={build}>{loading?"Constructing…":"Build real + paper slates"}</button></div>
            {err&&<div className="err">{err}</div>}
          </Panel>

          {out&&<div className="slate-cols">
            <div className="slate-col">
              <h4><Badge color="var(--accent)">REAL</Badge> main card</h4>
              {realWarn.length>0&&<div className="err" style={{color:"var(--warn)",borderColor:"var(--warn)",background:"color-mix(in srgb,var(--warn) 8%,transparent)"}}>Exposure cap: {realWarn.join(", ")} exceed the two-market default.</div>}
              {(out.real||[]).length===0?<Empty msg="No real tickets recommended — acceptable per your prompt."/>:(out.real||[]).map((t,i)=>{ const rc=t.rawOdds||combineAm((t.legs||[]).map(l=>l.odds)); return (
                <div className="ticket real" key={i}>
                  <div className="ticket-head"><Badge color="var(--accent)">{t.type}</Badge><span className="ticket-name">{t.name}</span><span className="ticket-odds mono">{fmtOdds(rc)}{t.boostedOdds&&<span className="boosted"> → {fmtOdds(t.boostedOdds)}</span>}</span></div>
                  <div className="legs">{(t.legs||[]).map((l,j)=>(<div className="leg" key={j}><span className="leg-ent">{l.entity}</span><span className="leg-prop">{l.proposition}</span><span className="mono">{fmtOdds(l.odds)}</span><span className="mono dim leg-game">{l.game}</span>{l.why&&<div className="leg-why">{l.why}</div>}</div>))}</div>
                  {t.rationale&&<div className="ticket-note">{t.rationale}</div>}
                  <div className="ticket-foot">{t.exposureNote&&<span className="chip">exposure: {t.exposureNote}</span>}{t.promoFit&&<span className="chip">promo: {t.promoFit}</span>}{t.stake&&<span className="chip">stake {fmtMoney(t.stake,0)}</span>}<div className="grow"/><button className="btn small primary" onClick={()=>saveReal(t)}>Save</button></div>
                </div>
              );})}
            </div>
            <div className="slate-col">
              <h4><Badge color="var(--paper)">PAPER</Badge> R&amp;D lab</h4>
              {(out.paper||[]).length===0?<Empty msg="No paper tests proposed."/>:(out.paper||[]).map((t,i)=>{ const rc=t.rawOdds||combineAm((t.legs||[]).map(l=>l.odds)); return (
                <div className="ticket paper" key={i}>
                  <div className="ticket-head"><Badge color="var(--paper)">{t.type}</Badge><span className="ticket-name">{t.name}</span><span className="ticket-odds mono">{fmtOdds(rc)}</span></div>
                  <div className="legs">{(t.legs||[]).map((l,j)=>(<div className="leg" key={j}><span className="leg-ent">{l.entity}</span><span className="leg-prop">{l.proposition}</span><span className="mono">{fmtOdds(l.odds)}</span><span className="mono dim leg-game">{l.game}</span>{l.why&&<div className="leg-why">{l.why}</div>}</div>))}</div>
                  {t.experiment&&<div className="ticket-note"><strong>Tests:</strong> {t.experiment}</div>}
                  {t.rationale&&<div className="ticket-note">{t.rationale}</div>}
                  <div className="ticket-foot"><div className="grow"/><button className="btn small paper" onClick={()=>savePaperT(t)}>Save to paper</button></div>
                </div>
              );})}
            </div>
          </div>}
          {out&&(out.rejects||[]).length>0&&<Panel title="Qualified-not-bet / rejects"><div>{out.rejects.map((r,i)=>(<div key={i} style={{fontSize:12,color:"var(--ink-2)",marginBottom:5}}><span className="strong">{r.entity}</span> {r.proposition} <span className="dim">— {r.reason}</span></div>))}</div></Panel>}
          {out&&out.notes&&<div className="hint" style={{padding:"4px 2px"}}>{out.notes}</div>}
          {raw&&!out&&<details className="raw"><summary>Raw model output</summary><pre>{raw}</pre></details>}
        </div>
      </div>
    </div>
  );
}

// ============================================================ LOG
function Log({ctx}){
  const [sub,setSub]=useState("cand");
  const tabs=[["cand","Candidates",(ctx.cand||[]).length,""],["tix","Real tickets",(ctx.tix||[]).length,""],["paper","Paper",(ctx.paper||[]).length,"paper"]];
  return (<div>
    <div className="subtabs">{tabs.map(([id,l,n,cls])=>(<button key={id} className={"subtab"+(sub===id?" on "+cls:"")} onClick={()=>setSub(id)}>{l}<span className="count">{n}</span></button>))}</div>
    {sub==="cand"&&<CandLog ctx={ctx}/>}
    {sub==="tix"&&<TixLog ctx={ctx}/>}
    {sub==="paper"&&<PaperLog ctx={ctx}/>}
  </div>);
}
function useFilter(rows,fields){
  const [q,setQ]=useState(""),[sport,setSport]=useState(""),[dec,setDec]=useState("");
  const filtered=useMemo(()=>rows.filter(r=>{ if(sport&&(r.Sport||r.sport)!==sport) return false; if(dec&&r.Decision!==dec) return false; if(q){ const s=q.toLowerCase(); return fields.some(f=>String(r[f]||"").toLowerCase().includes(s)); } return true; }),[rows,q,sport,dec,fields]);
  return {q,setQ,sport,setSport,dec,setDec,filtered};
}
function Toolbar({F,onAdd,dec}){
  return (<div className="toolbar"><input className="search" placeholder="Search…" value={F.q} onChange={e=>F.setQ(e.target.value)}/><select value={F.sport} onChange={e=>F.setSport(e.target.value)}><option value="">All sports</option>{SPORTS.map(s=><option key={s}>{s}</option>)}</select>{dec&&<select value={F.dec} onChange={e=>F.setDec(e.target.value)}><option value="">All decisions</option>{DECISIONS.map(d=><option key={d}>{d}</option>)}</select>}<div className="grow"/><button className="btn primary" onClick={onAdd}>+ Add</button></div>);
}
const E_CAND={ Date:todayISO(),"Candidate ID":"","Source Bucket":"SOURCED","Source / Research Set":"",Sport:"MLB",Game:"",Entity:"","Market Family":"Pitcher Outs","Bet / Proposition":"",Line:"","Odds (American)":"",Decision:"BET","Placed?":"N",Result:"","Loss Classification":"",Tier:"",Why:"",Thesis:"",Sources:"",Notes:"" };
function CandLog({ctx}){
  const rows=ctx.cand||[]; const F=useFilter(rows,["Entity","Game","Bet / Proposition","Market Family","Source / Research Set"]); const [edit,setEdit]=useState(null);
  const up=(r)=>{ const l=[...rows]; const i=l.findIndex(x=>x._id===r._id); if(i>=0)l[i]=r; else l.unshift(r); ctx.saveCand(l); setEdit(null); ctx.flash(i>=0?"Updated":"Added"); };
  const del=(r)=>{ ctx.saveCand(rows.filter(x=>x._id!==r._id)); setEdit(null); ctx.flash("Deleted"); };
  return (<div>
    <Toolbar F={F} dec onAdd={()=>setEdit({...E_CAND,_id:uid("c_")})}/>

// ============================================================ SETTINGS
function Settings({ctx}){
  const { meta,saveMeta,cand,tix,paper,flash,setHasKey }=ctx;
  const [key,setKey]=useState(store.get(K.key,""));
  const [model,setModel]=useState(store.get(K.model,MODELS[0]));
  const [prompt,setPrompt]=useState(store.get(K.prompt,DEFAULT_PROMPT));
  const [bank,setBank]=useState(meta.bankroll??""); const [unit,setUnit]=useState(meta.unit??1);
  const [testMsg,setTestMsg]=useState(null); const [testing,setTesting]=useState(false);
  const [refine,setRefine]=useState(null); const [rload,setRload]=useState(false); const [rerr,setRerr]=useState(null);
  const fileRef=useRef(); const [paste,setPaste]=useState("");

  const saveKey=()=>{ store.set(K.key,key.trim()); store.set(K.model,model); setHasKey(!!key.trim()); flash("API settings saved"); };
  const savePrompt=()=>{ store.set(K.prompt,prompt); flash("Prompt saved"); };
  const resetPrompt=()=>{ setPrompt(DEFAULT_PROMPT); store.set(K.prompt,DEFAULT_PROMPT); flash("Prompt reset to your Master v3"); };
  const saveBank=()=>{ saveMeta({...meta,bankroll:num(bank),unit:num(unit)||1}); flash("Bankroll saved"); };

  const test=async()=>{ store.set(K.key,key.trim()); store.set(K.model,model); setTesting(true); setTestMsg(null); const r=await callClaude({ system:"Reply with the single word: ok", content:"ping", useWeb:false, maxTokens:10 }); setTesting(false); if(r.error) setTestMsg({err:r.error}); else { setHasKey(true); setTestMsg({ok:"Connected. Model replied: "+(r.text||"").slice(0,40)}); } };

  const importData=(obj)=>{
    const map={ "Candidate Log":"cand","Ticket Log":"tix","Paper Portfolio":"paper", candidates:"cand",tickets:"tix",paper:"paper" };
    let n=0; const setters={cand:ctx.saveCand,tix:ctx.saveTix,paper:ctx.savePaper}; const pfx={cand:"c_",tix:"t_",paper:"p_"};
    for(const [k,t] of Object.entries(map)){ if(Array.isArray(obj[k])){ const w=obj[k].map(r=>r._id?r:{...r,_id:uid(pfx[t])}); setters[t](w); n+=w.length; } }
    const daily=obj["Daily Summary"]||obj.daily; const market=obj["Market Summary"]||obj.market;
    const nm={...meta}; if(Array.isArray(daily)) nm.daily=daily; if(Array.isArray(market)) nm.market=market;
    if(Array.isArray(daily)&&daily.length){ const last=daily[daily.length-1]; const b=num(last["Ending Bankroll"]); if(b!=null){ nm.bankroll=b; setBank(b); } }
    saveMeta(nm); flash("Imported "+n+" rows"+(Array.isArray(daily)?" + daily/market":""));
  };
  const onFile=(e)=>{ const f=e.target.files?.[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ importData(JSON.parse(rd.result)); }catch(x){ flash("Invalid JSON file"); } }; rd.readAsText(f); };
  const exportAll=()=>{ const blob={candidates:cand,tickets:tix,paper,meta}; const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(blob,null,2)],{type:"application/json"})); a.download="overlay_export_"+todayISO()+".json"; a.click(); };

  const summarize=()=>{
    const byMarket={}; const push=(rows,realFlag)=>rows.forEach(r=>{ const m=r["Market Family"]||"?"; const res=(r.Result||"").toLowerCase(); if(res!=="win"&&res!=="loss") return; const k=(realFlag?"REAL:":"PAPER:")+m; byMarket[k]=byMarket[k]||{w:0,n:0}; byMarket[k].n++; if(res==="win") byMarket[k].w++; });
    push(cand.filter(c=>c.Decision==="BET"),true); push(paper,false);
    const lc={}; [...cand,...tix,...paper].forEach(r=>{ const c=r["Loss Classification"]; if(c){ lc[c]=(lc[c]||0)+1; } });
    const lines=Object.entries(byMarket).map(([k,v])=>`${k}: ${v.w}/${v.n} (${Math.round(100*v.w/v.n)}%)`);
    const lcl=Object.entries(lc).map(([k,v])=>`${k}: ${v}`);
    return "MARKET HIT RATES (real vs paper):\n"+(lines.join("\n")||"none")+"\n\nRESULT CLASSIFICATIONS:\n"+(lcl.join("\n")||"none");
  };
  const proposeRefine=async()=>{
    setRload(true); setRerr(null); setRefine(null);
    const content=`Here is my current betting system prompt and my prospective results so far. Suggest CONCRETE, MINIMAL amendments to the prompt so it better matches what is actually winning/losing. Do not rewrite it wholesale. Prefer small rule additions, de-emphasis of weak markets, and threshold/market-expression tweaks that the data supports. Preserve the philosophy.\n\n=== RESULTS ===\n${summarize()}\n\n=== CURRENT PROMPT (may be long) ===\n${prompt.slice(0,6000)}\n\nReturn STRICT JSON only: {"additions":["exact sentence to add"],"deemphasize":["what to soften and why"],"rationale":["1-2 lines tying each to the data"]}`;
    const r=await callClaude({ system:"You refine betting research prompts from prospective results. Be conservative, specific, and data-driven.", content, useWeb:false, maxTokens:1200 });
    setRload(false);
    if(r.error){ setRerr(r.error); return; }
    const p=extractJSON(r.text); if(!p){ setRerr("Could not parse suggestions. Raw: "+(r.text||"").slice(0,200)); return; }
    setRefine(p);
  };
  const applyAddition=(s)=>{ const np=prompt+"\n\n"+s; setPrompt(np); store.set(K.prompt,np); flash("Appended to prompt"); };

  return (<div>
    <Panel title="API connection" right={<span className="hint">stored only in your browser</span>}>
      <Field label="Anthropic API key"><input type="password" value={key} onChange={e=>setKey(e.target.value)} placeholder="sk-ant-…"/></Field>
      <div className="form-grid two">
        <Field label="Model"><input list="models" value={model} onChange={e=>setModel(e.target.value)}/><datalist id="models">{MODELS.map(m=><option key={m} value={m}/>)}</datalist></Field>
        <div className="field"><span>&nbsp;</span><div className="row-flex"><button className="btn" onClick={test} disabled={testing}>{testing?"Testing…":"Test connection"}</button><button className="btn primary" onClick={saveKey}>Save</button></div></div>
      </div>
      {testMsg?.ok&&<div className="ok">{testMsg.ok}</div>}
      {testMsg?.err&&<div className="err">{testMsg.err}</div>}
      <p className="hint">Your key stays in this browser (localStorage) and is sent only to Anthropic. If Test fails with an invalid-model error, the message lists valid model names — paste one here. {HAS_LS?"":"Note: storage is blocked in this preview, so data won't persist here — it will once deployed."}</p>
    </Panel>

    <Panel title="Bankroll">
      <div className="form-grid two"><Field label="Confirmed bankroll ($)"><input value={bank} onChange={e=>setBank(e.target.value)}/></Field><Field label="Base unit ($)"><input value={unit} onChange={e=>setUnit(e.target.value)}/></Field></div>
      <div className="form-actions"><div className="grow"/><button className="btn primary" onClick={saveBank}>Save</button></div>
      <p className="hint">Passed to the AI so it never infers bankroll from stale history.</p>
    </Panel>

    <Panel title="System prompt (mutable)" right={<span className="hint">your Master v3 is the default</span>}>
      <Field label="This exact text is sent as the system prompt on every grade/build"><textarea rows={12} value={prompt} onChange={e=>setPrompt(e.target.value)} style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:12}}/></Field>
      <div className="form-actions"><button className="btn ghost" onClick={resetPrompt}>Reset to Master v3</button><div className="grow"/><button className="btn" onClick={proposeRefine} disabled={rload}>{rload?"Analyzing results…":"Propose refinements from results"}</button><button className="btn primary" onClick={savePrompt}>Save prompt</button></div>
      {rerr&&<div className="err">{rerr}</div>}
      {refine&&<div style={{marginTop:14}}>
        {(refine.additions||[]).map((s,i)=>(<div className="diffline add" key={"a"+i}><div className="row-flex"><span style={{flex:1}}>+ {s}</span><button className="btn small" onClick={()=>applyAddition(s)}>Append</button></div></div>))}
        {(refine.deemphasize||[]).map((s,i)=>(<div className="diffline rem" key={"d"+i}>~ {s}</div>))}
        {(refine.rationale||[]).length>0&&<p className="hint" style={{marginTop:8}}>Rationale: {(refine.rationale||[]).join(" · ")}</p>}
      </div>}
    </Panel>

    <Panel title="Data">
      <div className="counts" style={{marginBottom:12}}>
        {[["candidates",cand.length],["real tickets",tix.length],["paper",paper.length],["daily",(meta.daily||[]).length],["market",(meta.market||[]).length]].map(([k,v])=>(<div className="cnt" key={k}><div className="cnt-v mono">{v}</div><div className="cnt-k">{k}</div></div>))}
      </div>
      <div className="form-actions">
        <button className="btn primary" onClick={()=>fileRef.current?.click()}>Import history JSON</button>
        <input ref={fileRef} type="file" accept="application/json,.json" hidden onChange={onFile}/>
        <div className="grow"/>
        <button className="btn ghost" onClick={exportAll}>Export all</button>
      </div>
      <Field label="…or paste JSON"><textarea rows={3} value={paste} onChange={e=>setPaste(e.target.value)} placeholder='{"Candidate Log":[...],"Ticket Log":[...]}'/></Field>
      <div className="form-actions"><div className="grow"/><button className="btn ghost" onClick={()=>{ try{ importData(JSON.parse(paste)); setPaste(""); }catch(x){ flash("Invalid JSON"); } }}>Import pasted</button></div>
      <p className="hint">Accepts your tracker's sheet-style keys ("Candidate Log", "Ticket Log", "Paper Portfolio", "Daily Summary", "Market Summary") or app-style keys.</p>
    </Panel>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
